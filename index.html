<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: #000;
    color: #fff;
    font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== Hero 顶部 ===== */
  .hero {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: radial-gradient(ellipse at 50% 40%, #1a0f2e 0%, #000 70%);
  }
  .hero-img {
    width: 100%;
    max-width: 1000px;
    display: block;
    padding-top: 0;
  }
  .hero-title {
    font-size: clamp(40px, 9vw, 96px);
    font-weight: 900;
    letter-spacing: 2px;
    margin: -10px 0 0;
    text-align: center;
    background: linear-gradient(180deg, #ffffff 0%, #d9c7ff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .hero-sub {
    margin-top: 14px;
    font-size: clamp(15px, 2.6vw, 22px);
    color: #c9a4ff;
    letter-spacing: 6px;
    text-shadow: 0 0 20px rgba(190, 120, 255, 0.6);
  }
  .scroll-hint {
    margin: 36px 0 30px;
    color: #6b5a8a;
    font-size: 13px;
    letter-spacing: 2px;
    animation: bob 2s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); opacity: .6; }
    50% { transform: translateY(6px); opacity: 1; }
  }

  /* ===== 下方内容 ===== */
  .content {
    max-width: 760px;
    margin: 0 auto;
    padding: 60px 24px 100px;
    text-align: center;
  }
  .badge {
    display: inline-block;
    padding: 6px 18px;
    border: 1px solid rgba(190, 120, 255, 0.5);
    border-radius: 999px;
    color: #c9a4ff;
    font-size: 14px;
    letter-spacing: 1px;
    margin-bottom: 26px;
    background: rgba(150, 80, 230, 0.08);
  }
  .release-title {
    font-size: clamp(26px, 5vw, 42px);
    font-weight: 800;
    line-height: 1.35;
    margin-bottom: 22px;
  }
  .release-desc {
    font-size: clamp(15px, 2.4vw, 18px);
    line-height: 1.9;
    color: #b9b2c7;
    margin-bottom: 14px;
  }
  .players {
    margin: 26px 0 40px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
  }
  .player-chip {
    padding: 10px 22px;
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    font-size: 15px;
    color: #e6dff5;
  }
  .note {
    font-size: 13px;
    color: #6f6684;
    line-height: 1.8;
    margin-bottom: 46px;
  }

  /* ===== 按钮 ===== */
  .actions {
    display: flex;
    gap: 18px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 16px 38px;
    border-radius: 999px;
    font-size: 16px;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    transition: transform .15s ease, box-shadow .2s ease, background .2s ease;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn-github {
    background: transparent;
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.35);
  }
  .btn-github:hover { background: rgba(255,255,255,0.08); border-color: #fff; }
  .btn-download {
    background: linear-gradient(135deg, #a855f7 0%, #7c3aed 100%);
    color: #fff;
    border: none;
    box-shadow: 0 8px 30px rgba(140, 80, 240, 0.45);
  }
  .btn-download:hover { box-shadow: 0 12px 40px rgba(150, 90, 255, 0.65); }
  .btn svg { width: 20px; height: 20px; }

  footer {
    margin-top: 70px;
    font-size: 12px;
    color: #4a4358;
  }

  /* toast */
  #toast {
    position: fixed;
    left: 50%;
    bottom: 40px;
    transform: translateX(-50%) translateY(20px);
    background: #2a2238;
    color: #e6dff5;
    padding: 12px 22px;
    border-radius: 12px;
    font-size: 14px;
    border: 1px solid rgba(190,120,255,.4);
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease, transform .25s ease;
    z-index: 99;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
